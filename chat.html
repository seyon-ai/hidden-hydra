<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>Chat — Hidden Hydra</title>
  <meta name="theme-color" content="#05050A"/>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/logo-32.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/chat.css">
</head>
<body>

<div id="loading" class="loading-screen">
  <img src="assets/logo.png" alt="Hidden Hydra">
  <div class="ring"></div>
  <div class="loading-txt">ENTERING THE HYDRA</div>
</div>

<div id="app">
  <!-- SIDEBAR -->
  <aside id="sb" class="sidebar">
    <div class="sb-header">
      <div class="me-row" onclick="goProfile()">
        <div class="me-av" id="me-av"></div>
        <div class="me-info">
          <div class="me-name" id="me-name">—</div>
          <div class="me-status"><span class="pulse"></span>Online</div>
        </div>
        <button class="ib" title="Profile"  onclick="event.stopPropagation();goProfile()" id="btn-profile"></button>
        <button class="ib" title="Sign out" onclick="event.stopPropagation();doLogout()" id="btn-logout"></button>
        <button class="ib" title="Collapse panel" onclick="event.stopPropagation();toggleSidebar()" id="btn-sb"></button>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="world"   onclick="switchTab('world',this)">World</button>
        <button class="tab"        data-tab="dms"     onclick="switchTab('dms',this)">DMs</button>
        <button class="tab"        data-tab="groups"  onclick="switchTab('groups',this)">Groups</button>
        <button class="tab"        data-tab="explore" onclick="switchTab('explore',this)">Explore</button>
        <button class="tab"        data-tab="req"     onclick="switchTab('req',this)" style="position:relative">
          Req<span class="req-badge" id="req-badge">0</span>
        </button>
      </div>
      <div class="sb-search">
        <span id="sb-search-ic" style="display:flex"></span>
        <input type="text" id="search-inp" placeholder="Search people..." oninput="doSearch(this.value)">
        <button id="sc-clear" onclick="clearSearch()" style="display:none;background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px;line-height:1">×</button>
      </div>
    </div>
    <div class="chat-list" id="cl"></div>
    <button class="fab" id="fab" onclick="openCreateGroup()" style="display:none" title="Create group">＋</button>
  </aside>

  <!-- MAIN -->
  <main class="chat-main">
    <!-- Empty state -->
    <div class="empty-state" id="empty">
      <img src="assets/logo.png" alt="">
      <h2 style="font-family:'Cinzel',serif;font-size:22px;color:var(--faint);letter-spacing:6px;margin-bottom:10px">HIDDEN HYDRA</h2>
      <p style="font-size:13px;color:var(--faint);letter-spacing:1px;margin-bottom:24px">Select a chat or explore people — every message end-to-end encrypted</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
        <button class="btn-ghost" style="font-size:12px" id="empty-explore">Explore</button>
        <button class="btn-ghost" style="font-size:12px" id="empty-group">Create Group</button>
      </div>
    </div>

    <!-- Chat view -->
    <div class="chat-view" id="cv">
      <div class="ch-header">
        <button class="ib back-btn" id="menu-btn" title="Chats" onclick="toggleSidebar()"></button>
        <button class="back-btn" onclick="closeCv()" id="back-btn"></button>
        <div class="ch-av" id="ch-av"></div>
        <div style="flex:1;min-width:0">
          <div class="ch-name" id="ch-name">—</div>
          <div class="ch-sub"  id="ch-sub">—</div>
        </div>
        <span class="e2ee-badge" id="ch-lock" title="End-to-end encrypted"></span>
        <button class="ib" id="info-btn" style="display:none" onclick="openGroupInfo()" title="Group info"></button>
        <button class="ib" id="rp-btn" title="Toggle online panel" onclick="toggleRightPanel()"></button>
      </div>

      <div id="keybar">
        <span style="display:flex;color:var(--gold)" id="keybar-ic"></span>
        <span style="flex:1" id="keybar-txt">Syncing encryption keys — waiting for a member who holds this room's key.</span>
        <button class="btn-ghost" onclick="rekeyRetry()">Retry</button>
        <button class="btn-ghost" onclick="rekeyRoom(document.getElementById('keybar').dataset.gid)">New epoch</button>
      </div>

      <div class="msgs" id="msgs"></div>

      <button id="jump-btn" onclick="jumpBottom()" title="Jump to latest"></button>

      <div class="typing-row" id="typing-row" style="visibility:hidden">
        <div class="tdots"><span></span><span></span><span></span></div>
        <span id="typing-txt" class="typing-txt"></span>
      </div>

      <div class="reply-bar" id="reply-bar">
        <span style="color:var(--gold);flex-shrink:0;display:flex" id="rb-ic"></span>
        <div style="flex:1;min-width:0">
          <div class="rb-sender" id="rb-sender"></div>
          <div class="rb-text"   id="rb-text"></div>
        </div>
        <button onclick="cancelReply()" style="background:none;border:none;color:var(--dim);cursor:pointer;flex-shrink:0;display:flex" id="rb-x"></button>
      </div>

      <div class="inp-wrap">
        <div class="ep-panel" id="ep">
          <div class="ep-grid" id="ep-grid"></div>
        </div>
        <div id="pending-strip"></div>
        <div class="inp-row">
          <button class="ib" onclick="document.getElementById('img-inp').click()" title="Attach image" style="font-size:20px" id="attach-btn"></button>
          <input type="file" id="img-inp" accept="image/*" multiple style="display:none" onchange="attachFiles(this.files);this.value=''">
          <button class="ib" onclick="toggleEp()" title="Emoji" style="font-size:20px" id="emoji-btn"></button>
          <textarea class="msg-ta" id="msg-ta"
            placeholder="Speak in the shadows..."
            rows="1"
            oninput="taResize(this);notifyTyping()"
            onkeydown="taKey(event)"></textarea>
          <button class="send-btn" onclick="sendMsg()" title="Send" id="send-btn"></button>
        </div>
      </div>
    </div>
  </main>

  <!-- RIGHT PANEL -->
  <aside class="right-panel">
    <div class="rp-header"><span class="pulse"></span>Online Now</div>
    <div class="rp-list" id="rp-list"></div>
  </aside>
</div>

<button id="sb-open-float" onclick="toggleSidebar()" title="Slide chats panel back" aria-label="Open chats panel"></button>
<div id="sb-backdrop" onclick="closeMobileSidebar();document.getElementById('app').classList.remove('rp-open');this.style.display='none'"></div>

<div id="lightbox" onclick="closeLightbox()"><img id="lb-img" alt="attachment"></div>
<div id="toasts"></div>

<script type="module">
  import { icon } from './js/icons.js';
  // stamp static icons
  const put = (id, name, size) => { const el = document.getElementById(id); if (el) el.innerHTML = icon(name, '', size || 18); };
  put('btn-profile','user',17); put('btn-logout','logout',17); put('btn-sb','panel-left',17);
  put('sb-search-ic','search',15);
  put('menu-btn','menu',20); put('back-btn','back',20);
  put('ch-lock','lock',13); put('info-btn','info',17); put('rp-btn','panel-right',17);
  put('keybar-ic','key',16); put('jump-btn','jump',18);
  put('rb-ic','reply',13); put('rb-x','x',18);
  put('attach-btn','image',20); put('emoji-btn','smile',20);
  put('send-btn','send',17); put('sb-open-float','chev-right',18);
  put('empty-explore-ic','search',12);
  document.getElementById('empty-explore').innerHTML = icon('search','',13) + ' Explore';
  document.getElementById('empty-group').innerHTML  = icon('plus','',13) + ' Create Group';
</script>
<script type="module" src="js/chat.js"></script>
</body>
</html>
